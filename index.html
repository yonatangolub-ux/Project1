<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d3557">
  <title>תיק הטיול</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main id="app">
    <section id="arrived"></section>
    <section id="next" aria-live="polite"><p class="muted">טוען…</p></section>
    <section id="pinned"></section>
    <section id="later"></section>
    <footer id="footer">
      <div class="actions">
        <button id="btn-add" type="button">+ מעבר</button>
        <button id="btn-import" type="button">ייבוא</button>
      </div>
      <p id="offline-status" class="status"></p>
      <p class="status muted">המידע נשמר רק בטלפון הזה. <span id="app-version"></span></p>
    </footer>
  </main>

  <div id="viewer" hidden>
    <div class="viewer-bar">
      <span id="viewer-title"></span>
      <span id="viewer-hint">לחיצה על המסמך מגדילה</span>
    </div>
    <div id="viewer-scroll" dir="ltr">
      <div id="viewer-pages"></div>
      <div class="viewer-tools" dir="rtl">
        <button id="viewer-original" type="button" hidden>פתיחת הקובץ המקורי</button>
        <button id="viewer-replace" type="button">החלפת קובץ</button>
        <button id="viewer-delete" type="button" class="danger">מחיקת המסמך</button>
      </div>
    </div>
    <div class="viewer-foot">
      <button id="viewer-close" type="button">✕ סגירה</button>
    </div>
  </div>

  <dialog id="dlg-import">
    <form id="form-import">
      <h2>ייבוא מ-Claude</h2>
      <p class="hint">מדביקים כאן את הקוד שקיבלת. מעבר שכבר קיים מתעדכן, וכל השאר נשאר.</p>
      <textarea id="import-text" rows="8" dir="ltr" spellcheck="false" autocomplete="off"></textarea>
      <p class="error" id="import-error"></p>
      <div class="row">
        <button type="submit" class="primary">ייבוא</button>
        <button type="button" id="import-paste">הדבקה</button>
        <button type="button" class="link" data-close>ביטול</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-form">
    <form id="form-transition">
      <h2 id="form-heading">מעבר חדש</h2>
      <label>כותרת<input name="title" required placeholder="למשל: אוטובוס לילה"></label>
      <label>יציאה<input name="start" type="datetime-local" required></label>
      <label>הגעה (לא חובה)<input name="end" type="datetime-local"></label>
      <label>מאיפה<input name="from"></label>
      <label>לאן<input name="to"></label>
      <label>מה לעשות ומה לזכור<textarea name="notes" rows="4"></textarea></label>
      <label>מסמכים (שמות, עם פסיק ביניהם)<input name="docs" placeholder="כרטיס, דרכון"></label>
      <p class="hint" id="form-tz"></p>
      <p class="error" id="form-error"></p>
      <div class="row">
        <button type="submit" class="primary">שמירה</button>
        <button type="button" class="link" data-close>ביטול</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlg-doc">
    <form id="form-doc">
      <h2>מסמך חדש</h2>
      <label>שם המסמך<input name="name" list="doc-names" required placeholder="למשל: כרטיס טיסה"></label>
      <datalist id="doc-names"></datalist>
      <p class="hint">אחרי זה בוחרים תמונה או PDF מהטלפון או מהדרייב.</p>
      <div class="row">
        <button type="submit" class="primary">בחירת קובץ</button>
        <button type="button" class="link" data-close>ביטול</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="file-input" accept="image/*,application/pdf" hidden>
  <div id="toast" role="status" hidden></div>
</body>
</html>
